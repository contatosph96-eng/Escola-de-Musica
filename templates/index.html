<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Harmonia - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: linear-gradient(135deg, #090d16 0%, #111827 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #fff;
        }
        .login-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            width: 360px;
        }
        .login-card h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 8px; color: #f9fafb; }
        .login-card p { color: #9ca3af; font-size: 0.92rem; margin-bottom: 30px; }
        .login-card input {
            width: 100%; padding: 14px 16px; margin-bottom: 20px;
            background: #1f2937; border: 1px solid #374151; color: #fff;
            border-radius: 10px; text-align: center; font-size: 1rem; outline: none;
        }
        .login-card input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .login-card button {
            width: 100%; padding: 14px; background: #3b82f6; color: white;
            border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s;
        }
        .login-card button:hover { background: #2563eb; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none; font-weight: 500; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Academia Harmonia</h2>
        <p>Digite sua senha de acesso</p>
        <input type="password" id="senhaInput" placeholder="••••••••" onkeypress="handleEnter(event)">
        <button onclick="realizarLogin()">Entrar</button>
        <div id="erro" class="error-msg">Senha incorreta. Tente novamente.</div>
    </div>

    <script>
        function realizarLogin() {
            const senha = document.getElementById('senhaInput').value.trim();
            const erroMsg = document.getElementById('erro');

            if (senha.toLowerCase() === "aluno") {
                window.location.href = "/aluno";
            } else if (senha === "19554976") {
                window.location.href = "/admin";
            } else {
                erroMsg.style.display = "block";
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') realizarLogin();
        }
    </script>
</body>
</html>
